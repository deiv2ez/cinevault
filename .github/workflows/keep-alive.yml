name: Supabase Keep-Alive

# Evita que el proyecto GRATUITO de Supabase se pause por inactividad (~7 días).
# Cada 3 días hace una petición ligera a la base de datos (la mantiene "activa")
# y actualiza un pequeño archivo de marca de tiempo, para que GitHub tampoco
# desactive este cron por inactividad del repositorio (regla de los 60 días).
#
# La clave usada es la "publishable" (pública por diseño, protegida por RLS):
# Supabase la crea justamente para poder exponerse/commitearse sin riesgo.

on:
  schedule:
    - cron: '0 6 */3 * *'   # cada 3 días, 06:00 UTC
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping a Supabase (mantiene la base de datos activa)
        env:
          SUPABASE_URL: https://rzjhmnituyusxmetfrdf.supabase.co
          SUPABASE_KEY: sb_publishable_YE5nSsad8fqJixm83H0JJw_nybKtIPj
        run: |
          echo "Haciendo ping a Supabase..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/media_items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Respuesta HTTP: $code"
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "No hubo respuesta del proyecto"; exit 1
          fi
          echo "OK: el proyecto respondió (cuenta como actividad)."

      - name: Marcar actividad en el repo (evita que GitHub desactive el cron)
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keep-alive ping [skip ci]" || { echo "Sin cambios que commitear"; exit 0; }
          git push
